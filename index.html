<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitebox</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        *{
            margin:0%;
            padding: 0%;
        }

        header{
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color:black;
            height: 90px;
            padding: 0px 30px 0px 30px;
        }
        h2{
            color: white;
        }
        nav a{
            color: white;
            font-size: 25px;
            text-decoration: none;
        }
        nav{
            display: flex;
            gap: 30px;
            align-items: center;
        }
        a:hover{
            color: red;
        }

    </style>
    
</head>
<body>
    <header>
        <img src="images/logo.png" alt="logo" width="100px" height="50px">
    <!-- <h2>Bite<span style="color: red;">Box</span></h2> -->

    <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Contact</a>
        <a href="">Login</a>
        <a href="">SignUp</a>
    </nav>
    </header>
</body>
</html>
